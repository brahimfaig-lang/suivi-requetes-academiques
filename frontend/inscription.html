<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Suivi des requêtes académiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .input-shadow {
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-8">

  <!-- Carte d'Inscription -->
  <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-6 sm:p-8 border border-amber-500/20">
    
    <!-- En-tête -->
    <div class="text-center mb-6">
      <div class="inline-block p-2.5 bg-blue-950 rounded-full mb-2 shadow-md border border-amber-400/40">
        <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-blue-950">Créer un compte</h1>
      <p class="text-amber-600 text-xs mt-0.5 font-semibold tracking-wide uppercase">Faculté des Sciences - Université de Douala</p>
    </div>

    <!-- Formulaire -->
    <form id="registerForm" class="space-y-3.5">
      
      <!-- Nom & Prénom -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-blue-900">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </span>
          <input type="text" id="nom" required placeholder="Nom"
            class="w-full pl-10 pr-3 py-2.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-medium transition">
        </div>

        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-blue-900">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
          </span>
          <input type="text" id="prenom" required placeholder="Prénom"
            class="w-full pl-10 pr-3 py-2.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-medium transition">
        </div>
      </div>

      <!-- Email -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-900">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </span>
        <input type="email" id="email" required placeholder="Adresse email"
          class="w-full pl-11 pr-4 py-2.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-medium transition">
      </div>

      <!-- Matricule -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-900">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2"></path>
          </svg>
        </span>
        <input type="text" id="matricule" placeholder="Matricule (étudiant)"
          class="w-full pl-11 pr-4 py-2.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-medium transition">
      </div>

      <!-- Mot de passe -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-900">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </span>
        <input type="password" id="motDePasse" required minlength="6" placeholder="Mot de passe"
          class="w-full pl-11 pr-4 py-2.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-medium transition">
      </div>

      <!-- Rôle -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-900">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </span>
        <select id="role"
          class="w-full pl-11 pr-8 py-2.5 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-xs font-medium transition cursor-pointer appearance-none">
          <option value="ETUDIANT">Étudiant</option>
          <option value="AGENT">Agent</option>
          <option value="ADMIN">Administrateur</option>
        </select>
        <span class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-slate-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
          </svg>
        </span>
      </div>

      <!-- Messages de retour -->
      <div id="erreurMessage" class="text-red-600 text-xs font-semibold text-center hidden bg-red-50 p-2.5 rounded-full border border-red-200"></div>
      <div id="succesMessage" class="text-emerald-700 text-xs font-semibold text-center hidden bg-emerald-50 p-2.5 rounded-full border border-emerald-200"></div>

      <!-- Bouton d'action -->
      <div class="pt-2">
        <button type="submit"
          class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-full shadow-lg hover:shadow-xl transition transform active:scale-95 text-xs sm:text-sm uppercase tracking-wider">
          S'inscrire
        </button>
      </div>
    </form>

    <!-- Navigation Connexion -->
    <div class="mt-6 text-center space-y-2">
      <p class="text-xs text-slate-500 font-medium">Déjà un compte ?</p>
      <a href="index.html"
        class="block w-full py-2 bg-blue-950 hover:bg-blue-900 text-amber-400 font-semibold rounded-full text-xs transition shadow-md text-center">
        Se connecter
      </a>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreurDiv = document.getElementById('erreurMessage');
      const succesDiv = document.getElementById('succesMessage');
      erreurDiv.classList.add('hidden');
      succesDiv.classList.add('hidden');

      const payload = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        email: document.getElementById('email').value,
        motDePasse: document.getElementById('motDePasse').value,
        role: document.getElementById('role').value,
        matricule: document.getElementById('matricule').value || null,
      };

      try {
        await apiRequest('/auth/register', 'POST', payload, false);
        succesDiv.textContent = "Compte créé avec succès. Redirection...";
        succesDiv.classList.remove('hidden');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } catch (error) {
        erreurDiv.textContent = error.message;
        erreurDiv.classList.remove('hidden');
      }
    });
  
    document.addEventListener('DOMContentLoaded', () => {
      const roleSelect = document.getElementById('role');
      const matriculeInput = document.getElementById('matricule');

      function gererObligationMatricule() {
        const role = roleSelect.value;
        if (role === 'ETUDIANT' || role === 'Étudiant') {
          matriculeInput.required = true;  
        } else {
          matriculeInput.required = false;
          matriculeInput.setCustomValidity('');
        }
      }

      gererObligationMatricule();
      roleSelect.addEventListener('change', gererObligationMatricule);
    });
  </script>

</body>
</html>
