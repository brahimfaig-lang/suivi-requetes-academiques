<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Administration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

  <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-lg text-gray-800">Administration</h1>
      <p class="text-sm text-gray-500" id="nomUtilisateur"></p>
    </div>
    <button onclick="deconnexion()" class="text-sm text-red-600 hover:underline">Se déconnecter</button>
  </nav>

  <div class="max-w-5xl mx-auto px-4 py-8">

    <!-- Statistiques -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="statsCards">
      <div class="bg-white rounded-xl shadow-sm p-4">
        <p class="text-xs text-gray-500">Total requêtes</p>
        <p class="text-2xl font-bold text-gray-800" id="statTotal">-</p>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-800">Toutes les requêtes</h2>
      <input type="text" id="recherche" placeholder="Rechercher par référence..."
        class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm">
    </div>

    <div id="listeRequetes" class="space-y-3">
      <p class="text-gray-500 text-sm">Chargement...</p>
    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!estConnecte()) window.location.href = '../index.html';

    const utilisateur = getUtilisateur();
    document.getElementById('nomUtilisateur').textContent = `${utilisateur.prenom} ${utilisateur.nom}`;

    const statutCouleurs = {
      SOUMISE: 'bg-yellow-100 text-yellow-800',
      EN_COURS_DE_TRAITEMENT: 'bg-blue-100 text-blue-800',
      EN_ATTENTE_DE_COMPLEMENT: 'bg-orange-100 text-orange-800',
      TRAITEE: 'bg-green-100 text-green-800',
      REJETEE: 'bg-red-100 text-red-800',
    };

    async function chargerStats() {
      try {
        const stats = await apiRequest('/dashboard/stats', 'GET');
        const conteneur = document.getElementById('statsCards');

        let html = `
          <div class="bg-white rounded-xl shadow-sm p-4">
            <p class="text-xs text-gray-500">Total requêtes</p>
            <p class="text-2xl font-bold text-gray-800">${stats.total}</p>
          </div>
        `;

        stats.parStatut.forEach(s => {
          html += `
            <div class="bg-white rounded-xl shadow-sm p-4">
              <p class="text-xs text-gray-500">${s.statut.replace(/_/g, ' ')}</p>
              <p class="text-2xl font-bold text-gray-800">${s.total}</p>
            </div>
          `;
        });

        conteneur.innerHTML = html;
      } catch (error) {
        console.error(error);
      }
    }

    async function chargerRequetes(filtre = '') {
      const conteneur = document.getElementById('listeRequetes');
      try {
        const query = filtre ? `?reference=${filtre}` : '';
        const requetes = await apiRequest(`/requetes${query}`, 'GET');

        if (requetes.length === 0) {
          conteneur.innerHTML = '<p class="text-gray-500 text-sm">Aucune requête.</p>';
          return;
        }

        conteneur.innerHTML = requetes.map(r => `
          <a href="detail-requete.html?id=${r.id}" class="block bg-white rounded-lg shadow-sm p-4 hover:shadow-md transition">
            <div class="flex justify-between items-start">
              <div>
                <p class="font-medium text-gray-800">${r.objet}</p>
                <p class="text-xs text-gray-500 mt-1">${r.reference} · ${r.etudiant.prenom} ${r.etudiant.nom} · Agent: ${r.agent ? r.agent.prenom + ' ' + r.agent.nom : 'Non affecté'}</p>
              </div>
              <span class="text-xs px-2 py-1 rounded-full font-medium ${statutCouleurs[r.statut] || ''}">
                ${r.statut.replace(/_/g, ' ')}
              </span>
            </div>
          </a>
        `).join('');
      } catch (error) {
        conteneur.innerHTML = `<p class="text-red-600 text-sm">${error.message}</p>`;
      }
    }

    document.getElementById('recherche').addEventListener('input', (e) => {
      chargerRequetes(e.target.value);
    });

    chargerStats();
    chargerRequetes();
  </script>

</body>
</html>
