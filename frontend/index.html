<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Suivi des requêtes académiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

  <div class="bg-white rounded-xl shadow-md w-full max-w-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Suivi des requêtes académiques</h1>
      <p class="text-gray-500 text-sm mt-1">Faculté des Sciences - Université de Douala</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label for="motDePasse" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input type="password" id="motDePasse" required
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div id="erreurMessage" class="text-red-600 text-sm hidden"></div>

      <button type="submit"
        class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">
        Se connecter
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Pas encore de compte ?
      <a href="inscription.html" class="text-blue-600 hover:underline">S'inscrire</a>
    </p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreurDiv = document.getElementById('erreurMessage');
      erreurDiv.classList.add('hidden');

      const email = document.getElementById('email').value;
      const motDePasse = document.getElementById('motDePasse').value;

      try {
        const data = await apiRequest('/auth/login', 'POST', { email, motDePasse }, false);
        sauvegarderSession(data.token, data.utilisateur);
        redirigerSelonRole();
      } catch (error) {
        erreurDiv.textContent = error.message;
        erreurDiv.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
