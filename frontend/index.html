<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Suivi des requêtes académiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .input-shadow {
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

  <!-- Carte de Connexion -->
  <div class="bg-white rounded-[2rem] shadow-2xl w-full max-w-md p-8 sm:p-10 border border-amber-500/20">
    
    <!-- En-tête avec couleurs de l'Univ de Douala -->
    <div class="text-center mb-8">
      <div class="inline-block p-3 bg-blue-950 rounded-full mb-3 shadow-md border border-amber-400/40">
        <svg class="w-8 h-8 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-blue-950">Connexion</h1>
      <p class="text-amber-600 text-xs mt-1 font-semibold tracking-wide uppercase">Faculté des Sciences - Université de Douala</p>
    </div>

    <!-- Formulaire -->
    <form id="loginForm" class="space-y-4">
      
      <!-- Champ Email -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-900">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </span>
        <input type="email" id="email" required placeholder="Adresse email"
          class="w-full pl-12 pr-4 py-3 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium transition">
      </div>

      <!-- Champ Mot de passe -->
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-blue-900">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </span>
        <input type="password" id="motDePasse" required placeholder="Mot de passe"
          class="w-full pl-12 pr-4 py-3 bg-slate-100 border border-slate-200 text-slate-800 rounded-full input-shadow focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm font-medium transition">
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-xs px-2 pt-1">
        <label class="flex items-center text-slate-600 cursor-pointer">
          <input type="checkbox" class="rounded border-slate-300 text-blue-900 focus:ring-amber-500 mr-2">
          Se souvenir de moi
        </label>
        <a href="#" class="text-blue-900 hover:text-amber-600 font-semibold transition">Mot de passe oublié ?</a>
      </div>

      <!-- Message d'erreur -->
      <div id="erreurMessage" class="text-red-600 text-xs font-semibold text-center hidden bg-red-50 p-2.5 rounded-full border border-red-200"></div>

      <!-- Bouton Doré Principal -->
      <div class="pt-2">
        <button type="submit"
          class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-full shadow-lg hover:shadow-xl transition transform active:scale-95 text-sm uppercase tracking-wider">
          Se connecter
        </button>
      </div>
    </form>

    <!-- Navigation Inscription -->
    <div class="mt-8 text-center space-y-3">
      <p class="text-xs text-slate-500 font-medium">Vous n'avez pas encore de compte ?</p>
      <a href="inscription.html"
        class="block w-full py-2.5 bg-blue-950 hover:bg-blue-900 text-amber-400 font-semibold rounded-full text-xs transition shadow-md text-center">
        Créer un compte
      </a>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const erreurDiv = document.getElementById('erreurMessage');
      erreurDiv.classList.add('hidden');

      const email = document.getElementById('email').value;
      const motDePasse = document.getElementById('motDePasse').value;

      try {
        const data = await apiRequest('/auth/login', 'POST', { email, motDePasse }, false);
        sauvegarderSession(data.token, data.utilisateur);
        redirigerSelonRole();
      } catch (error) {
        erreurDiv.textContent = error.message;
        erreurDiv.classList.remove('hidden');
      }
    });
  </script>

</body>
</html>
