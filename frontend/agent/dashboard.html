<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Agent - Suivi des requêtes académiques</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <div class="flex h-screen overflow-hidden">

    <!-- SIDEBAR (Bleu Marine & Accents Or) -->
    <aside class="w-72 bg-blue-950 text-white flex-col hidden lg:flex border-r border-amber-500/20 overflow-y-auto">
      <!-- En-tête Sidebar -->
      <div class="px-6 py-7 border-b border-blue-900/60 flex items-center gap-3">
        <img src="../../images/logo-faculte-sciences.png" alt="Logo Faculté des Sciences" class="w-11 h-11 rounded-xl object-contain bg-white p-1 shrink-0 shadow-md">
        <div>
          <p class="font-bold text-base leading-tight text-white">Faculté des Sciences</p>
          <p class="text-xs text-amber-400 uppercase tracking-wider font-semibold">Espace Agent</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-4 py-6 space-y-1.5">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-900 text-amber-400 text-sm font-semibold shadow-sm border-l-4 border-amber-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          Mes requêtes
        </a>
      </nav>

      <!-- Profil & Déconnexion -->
      <div class="px-4 py-5 border-t border-blue-900/60 bg-blue-950/50">
        <div class="flex items-center gap-3 px-2">
          <div class="w-10 h-10 rounded-full bg-blue-900 border-2 border-amber-400 flex items-center justify-center text-sm font-bold text-amber-400 shrink-0 shadow" id="sidebarAvatar">A</div>
          <div class="min-w-0">
            <p class="text-sm font-semibold truncate text-white" id="sidebarNom">Agent</p>
            <p class="text-xs text-slate-400 truncate" id="sidebarEmail">email@univ-douala.cm</p>
          </div>
        </div>
        <button onclick="deconnexion()" class="mt-4 w-full text-left text-xs text-rose-400 hover:text-rose-300 font-semibold transition-colors px-2 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          <span>Se déconnecter</span>
        </button>
      </div>
    </aside>

    <!-- MOBILE TOP BAR -->
    <div class="lg:hidden fixed top-0 inset-x-0 z-20 bg-blue-950 text-white px-4 py-4 flex items-center justify-between shadow-md border-b border-amber-500/20">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-amber-500 text-blue-950 flex items-center justify-center text-xs font-bold">FS</div>
        <span class="font-bold text-sm tracking-wide">Espace Agent</span>
      </div>
      <button onclick="deconnexion()" class="text-xs text-rose-400 font-semibold">Déconnexion</button>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-1 pt-20 lg:pt-0 overflow-y-auto h-full">

      <!-- En-tête Principal -->
      <header class="bg-white border-b border-slate-200/80 px-6 lg:px-10 py-6 lg:py-8 shadow-sm">
        <p class="text-xs uppercase tracking-wider text-amber-600 font-bold mb-1">Espace Agent</p>
        <h1 class="text-2xl lg:text-3xl font-bold text-blue-950">Bonjour, <span id="prenomHeader">—</span></h1>
        <p class="text-sm text-slate-500 mt-1">Requêtes académiques qui vous sont spécifiquement affectées</p>
      </header>

      <div class="px-6 lg:px-10 py-6 lg:py-8 space-y-6">

        <!-- CARTES STATS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
          <div class="bg-white rounded-2xl p-4 lg:p-5 border border-slate-200/80 shadow-sm hover:border-amber-500/50 transition">
            <p class="text-[11px] uppercase tracking-wide text-slate-400 font-bold mb-2">Total affectées</p>
            <p class="text-2xl lg:text-3xl font-bold text-blue-950" id="statTotal">0</p>
          </div>
          <div class="bg-white rounded-2xl p-4 lg:p-5 border border-slate-200/80 shadow-sm hover:border-amber-500/50 transition">
            <p class="text-[11px] uppercase tracking-wide text-blue-800 font-bold mb-2">En cours</p>
            <p class="text-2xl lg:text-3xl font-bold text-blue-900" id="statEnCours">0</p>
          </div>
          <div class="bg-white rounded-2xl p-4 lg:p-5 border border-slate-200/80 shadow-sm hover:border-amber-500/50 transition">
            <p class="text-[11px] uppercase tracking-wide text-orange-600 font-bold mb-2">En attente</p>
            <p class="text-2xl lg:text-3xl font-bold text-orange-600" id="statAttente">0</p>
          </div>
          <div class="bg-white rounded-2xl p-4 lg:p-5 border border-slate-200/80 shadow-sm hover:border-amber-500/50 transition">
            <p class="text-[11px] uppercase tracking-wide text-emerald-700 font-bold mb-2">Traitées</p>
            <p class="text-2xl lg:text-3xl font-bold text-emerald-600" id="statTraitee">0</p>
          </div>
        </div>

        <!-- FILTRES PAR STATUT -->
        <div class="flex flex-wrap gap-2 pt-2">
          <button class="filtre-btn text-xs font-bold px-4 py-2.5 rounded-xl bg-blue-950 text-amber-400 border border-blue-950 shadow-sm transition-all" data-statut="">Toutes</button>
          <button class="filtre-btn text-xs font-bold px-4 py-2.5 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-all" data-statut="EN_COURS_DE_TRAITEMENT">En cours</button>
          <button class="filtre-btn text-xs font-bold px-4 py-2.5 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-all" data-statut="EN_ATTENTE_DE_COMPLEMENT">En attente</button>
          <button class="filtre-btn text-xs font-bold px-4 py-2.5 rounded-xl bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 transition-all" data-statut="TRAITEE">Traitées</button>
        </div>

        <!-- LISTE DES REQUÊTES -->
        <div id="listeRequetes" class="space-y-3">
          <div class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center text-xs text-slate-400">
            Chargement de vos dossiers...
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    if (!estConnecte()) window.location.href = '../index.html';

    const utilisateur = getUtilisateur();
    document.getElementById('prenomHeader').textContent = utilisateur.prenom;
    document.getElementById('sidebarNom').textContent = `${utilisateur.prenom} ${utilisateur.nom}`;
    document.getElementById('sidebarEmail').textContent = utilisateur.email;
    document.getElementById('sidebarAvatar').textContent = utilisateur.prenom.charAt(0).toUpperCase();

    // Badges harmonisés selon la charte
    const statutConfig = {
      SOUMISE:                  { label: 'Soumise',               badge: 'bg-amber-100 text-amber-800 border border-amber-200' },
      EN_COURS_DE_TRAITEMENT:   { label: 'En cours',              badge: 'bg-blue-100 text-blue-800 border border-blue-200' },
      EN_ATTENTE_DE_COMPLEMENT: { label: 'En attente complément', badge: 'bg-orange-100 text-orange-800 border border-orange-200' },
      TRAITEE:                  { label: 'Traitée',               badge: 'bg-emerald-100 text-emerald-800 border border-emerald-200' },
      REJETEE:                  { label: 'Rejetée',               badge: 'bg-rose-100 text-rose-800 border border-rose-200' },
    };

    let statutActif = '';
    let toutesMesRequetes = [];

    async function chargerRequetes() {
      const conteneur = document.getElementById('listeRequetes');
      conteneur.innerHTML = '<div class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center text-xs text-slate-400">Chargement de vos dossiers...</div>';
      try {
        const toutes = await apiRequest('/requetes', 'GET');
        toutesMesRequetes = toutes.filter(r => r.agentId === utilisateur.id);

        document.getElementById('statTotal').textContent = toutesMesRequetes.length;
        document.getElementById('statEnCours').textContent = toutesMesRequetes.filter(r => r.statut === 'EN_COURS_DE_TRAITEMENT').length;
        document.getElementById('statAttente').textContent = toutesMesRequetes.filter(r => r.statut === 'EN_ATTENTE_DE_COMPLEMENT').length;
        document.getElementById('statTraitee').textContent = toutesMesRequetes.filter(r => r.statut === 'TRAITEE').length;

        const filtrees = statutActif ? toutesMesRequetes.filter(r => r.statut === statutActif) : toutesMesRequetes;

        if (filtrees.length === 0) {
          conteneur.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200/80 p-8 text-center text-xs text-slate-400 font-medium">
              Aucune requête ne correspond à ce filtre.
            </div>`;
          return;
        }

        conteneur.innerHTML = filtrees.map(r => {
          const cfg = statutConfig[r.statut] || { label: r.statut, badge: 'bg-slate-100 text-slate-700' };
          const matriculeTxt = r.etudiant.matricule ? `Mat: ${r.etudiant.matricule}` : 'Sans matricule';

          return `
            <a href="detail-requete.html?id=${r.id}" class="block bg-white rounded-2xl border border-slate-200/80 p-4 lg:p-5 hover:border-amber-500/80 hover:shadow-md transition-all">
              <div class="flex justify-between items-start gap-3">
                <div class="min-w-0 space-y-1">
                  <p class="font-bold text-blue-950 text-sm leading-snug">${r.objet}</p>
                  <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500">
                    <span class="font-mono text-amber-600 font-semibold bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200/60">${r.reference}</span>
                    <span>•</span>
                    <span>Étd : <strong class="text-slate-700">${r.etudiant.prenom} ${r.etudiant.nom}</strong></span>
                    <span>•</span>
                    <span class="text-slate-400">${matriculeTxt}</span>
                  </div>
                </div>
                <span class="text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-wider shrink-0 ${cfg.badge}">
                  ${cfg.label}
                </span>
              </div>
            </a>
          `;
        }).join('');
      } catch (error) {
        conteneur.innerHTML = `<div class="bg-rose-50 text-rose-700 p-4 rounded-xl text-xs font-semibold border border-rose-200">${error.message}</div>`;
      }
    }

    // Gestion du basculement visuel des boutons filtres
    document.querySelectorAll('.filtre-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filtre-btn').forEach(b => {
          b.classList.remove('bg-blue-950', 'text-amber-400', 'border-blue-950', 'shadow-sm');
          b.classList.add('bg-white', 'text-slate-700', 'border-slate-200');
        });
        btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200');
        btn.classList.add('bg-blue-950', 'text-amber-400', 'border-blue-950', 'shadow-sm');
        statutActif = btn.dataset.statut;
        chargerRequetes();
      });
    });

    chargerRequetes();
  </script>

</body>
</html>
